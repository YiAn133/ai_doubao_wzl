<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <div id="todo"></div>
    
    <script>
        fetch("http://127.0.0.1:8080/todo").then(res =>res.json()).then(data => {
            todo.innerHTML = data.map(todo => `<li>${todo.title}</li>`)
            
        })
    </script>
</body>
</html>
