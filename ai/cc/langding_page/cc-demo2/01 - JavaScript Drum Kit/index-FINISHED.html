<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>JS Drum Kit</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="https://fav.farm/✅" />
</head>
<body>


  <div class="keys">
    <div data-key="65" class="key">
      <kbd>A</kbd>
      <span class="sound">clap</span>
    </div>
    <div data-key="83" class="key">
      <kbd>S</kbd>
      <span class="sound">hihat</span>
    </div>
    <div data-key="68" class="key">
      <kbd>D</kbd>
      <span class="sound">kick</span>
    </div>
    <div data-key="70" class="key">
      <kbd>F</kbd>
      <span class="sound">openhat</span>
    </div>
    <div data-key="71" class="key">
      <kbd>G</kbd>
      <span class="sound">boom</span>
    </div>
    <div data-key="72" class="key">
      <kbd>H</kbd>
      <span class="sound">ride</span>
    </div>
    <div data-key="74" class="key">
      <kbd>J</kbd>
      <span class="sound">snare</span>
    </div>
    <div data-key="75" class="key">
      <kbd>K</kbd>
      <span class="sound">tom</span>
    </div>
    <div data-key="76" class="key">
      <kbd>L</kbd>
      <span class="sound">tink</span>
    </div>
  </div>

  <audio data-key="65" src="sounds/clap.wav"></audio>
  <audio data-key="83" src="sounds/hihat.wav"></audio>
  <audio data-key="68" src="sounds/kick.wav"></audio>
  <audio data-key="70" src="sounds/openhat.wav"></audio>
  <audio data-key="71" src="sounds/boom.wav"></audio>
  <audio data-key="72" src="sounds/ride.wav"></audio>
  <audio data-key="74" src="sounds/snare.wav"></audio>
  <audio data-key="75" src="sounds/tom.wav"></audio>
  <audio data-key="76" src="sounds/tink.wav"></audio>

<script>
  function randomColor() {
    return `hsl(${Math.floor(Math.random() * 360)}, 100%, 50%)`;
  }

  function removeTransition(e) {
    if (e.propertyName !== 'transform') return;
    e.target.classList.remove('playing');
  }

  function createRipple(key, originEvent) {
    const ripple = document.createElement('span');
    ripple.className = 'ripple';
    const rect = key.getBoundingClientRect();
    const size = Math.max(rect.width, rect.height) * 2;
    ripple.style.width = ripple.style.height = size + 'px';

    let x, y;
    if (originEvent.type === 'mousedown') {
      x = originEvent.clientX - rect.left - size / 2;
      y = originEvent.clientY - rect.top - size / 2;
    } else {
      x = (rect.width - size) / 2;
      y = (rect.height - size) / 2;
    }
    ripple.style.left = x + 'px';
    ripple.style.top = y + 'px';

    key.appendChild(ripple);
    ripple.addEventListener('animationend', () => ripple.remove());
  }

  function triggerSound(keyElement) {
    const audio = document.querySelector(`audio[data-key="${keyElement.dataset.key}"]`);
    if (!audio) return;

    keyElement.classList.remove('playing');
    void keyElement.offsetWidth;
    keyElement.style.setProperty('--glow-color', randomColor());
    keyElement.classList.add('playing');

    audio.currentTime = 0;
    audio.play();
  }

  function playSound(e) {
    const key = document.querySelector(`div[data-key="${e.keyCode}"]`);
    if (!key) return;
    createRipple(key, e);
    triggerSound(key);
  }

  function handleClick(e) {
    const key = e.target.closest('.key');
    if (!key) return;
    createRipple(key, e);
    triggerSound(key);
  }

  const keys = Array.from(document.querySelectorAll('.key'));
  keys.forEach(key => {
    key.addEventListener('transitionend', removeTransition);
    key.addEventListener('mousedown', handleClick);
  });
  window.addEventListener('keydown', playSound);
</script>


</body>
</html>
